services:
  postgres:
    image: postgres:16
    container_name: cinema_postgres
    restart: always
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: cinema_db
    ports:
      - "5432:5432"
    volumes:
      - cinema_pg_data:/var/lib/postgresql/data

volumes:
  cinema_pg_data: